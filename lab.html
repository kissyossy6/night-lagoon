<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ラボ — Night Lagoon</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px/1.4 system-ui, sans-serif; color: #cfe3ff; }
      canvas { display: block; }
      #ui { position: fixed; top: 8px; left: 8px; background: rgba(8,12,20,.78); padding: 8px 10px; border-radius: 6px; display: grid; grid-template-columns: auto auto; gap: 4px 8px; align-items: center; }
      #ui select, #ui input { font: inherit; }
      #stats { position: fixed; bottom: 8px; left: 8px; opacity: .7; }
      body.shot #ui, body.shot #stats { display: none; }
    </style>
  </head>
  <body>
    <div id="ui"></div>
    <div id="stats"></div>
    <script type="module" src="/src/lab/main.ts"></script>
